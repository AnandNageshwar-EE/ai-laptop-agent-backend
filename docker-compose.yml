# Runs the backend. There is deliberately no database service — see
# docs/OBSERVABILITY.md for why, and what would justify adding one.
#
# The Streamlit frontend lives in its own repository:
#   https://github.com/AnandNageshwar-EE/ai-laptop-agent-frontend
# The `frontend` service below expects that repo checked out as a sibling
# directory. Comment it out to run the backend alone.

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      LLM_MODE: ${LLM_MODE:-offline}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-ai-laptop-agent}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      CORS_ALLOW_ORIGINS: '["http://localhost:8501","http://127.0.0.1:8501"]'
    restart: unless-stopped

  frontend:
    build: ../ai-laptop-agent-frontend
    ports:
      - "8501:8501"
    environment:
      AGENT_API_BASE_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
