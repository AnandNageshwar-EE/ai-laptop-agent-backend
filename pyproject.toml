[project]
name = "laptop-agent-backend"
version = "1.0.0"
description = "AI laptop shopping agent — LangGraph backend with guardrails, prompt caching and LangSmith tracing"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3.30",
    "langchain-anthropic>=0.3.5",
    # OpenRouter and other OpenAI-compatible gateways.
    "langchain-openai>=0.2.10",
    "langsmith>=0.2.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laptop_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
